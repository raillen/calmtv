name: quality

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Install GTK3 and SQLite build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - name: Test
        run: make test
      - name: Build
        run: make build
  atlas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Atlas CLI
        run: echo "Atlas CLI is supplied by the project runner in release CI"
      - name: Validate canonical documentation
        run: test -f atlas.json && test -f PROJECT_STATE.md && test -f docs/ATLAS.md && test -f .ai/orchestration/model-policy.json
